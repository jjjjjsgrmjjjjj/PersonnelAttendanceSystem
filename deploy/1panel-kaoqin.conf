# 示例影像部 运动会考勤系统 —— 1Panel「网站 → 反向代理」用配置
#
# 1Panel 操作步骤：
#   1) 网站 → 创建网站 → 「反向代理」
#        主域名：填你自己的域名或服务器IP（如 kaoqin.example.com）
#        代理地址：http://<应用所在地址>:3000
#                  · 应用与 1Panel 同机（非容器）：http://127.0.0.1:3000
#                  · 应用跑在 Docker 容器里：http://127.0.0.1:3000
#                    （本机实测：容器 IP 127.0.0.1，网关 127.0.0.1，
#                      容器内 /healthz 返回 ok；1Panel 若连不通可改填
#                      http://127.0.0.1:3000 并把容器 3000 端口映射到宿主机）
#   2) 创建后 → 该网站 → 「配置文件」，把下面 server{} 里的 location 段
#      按需补充（1Panel 会自动生成 proxy_pass，此处仅作对照/整段替换用）。
#   3) 保存后 1Panel 会自动 nginx -t 并 reload。

server {
    listen 80;
    listen [::]:80;
    server_name kaoqin.example.com;

    access_log /www/sites/kaoqin.example.com/log/access.log;
    error_log  /www/sites/kaoqin.example.com/log/error.log;

    # 现场手机填报的请求体很小
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
}
