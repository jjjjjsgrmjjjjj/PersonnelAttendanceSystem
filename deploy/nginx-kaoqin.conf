# 示例影像部 运动会考勤系统 —— nginx 反向代理示例
# 用法：
#   cp deploy/nginx-kaoqin.conf /etc/nginx/conf.d/kaoqin.conf
#   修改 server_name
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d kaoqin.example.com      # 可选：签发 HTTPS 证书

server {
    listen 80;
    listen [::]:80;
    server_name kaoqin.example.com;

    # 若已用 certbot 签发证书，可打开下面这行强制跳转 HTTPS
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/kaoqin.access.log;
    error_log  /var/log/nginx/kaoqin.error.log;

    # 运动会现场手机上传的请求体很小，限制得紧一些
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }
}

